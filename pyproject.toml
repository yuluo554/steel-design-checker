[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "sdc"
version = "0.1.0"
description = "钢结构连接与构件验算计算器（规范驱动、离线可复现）"
requires-python = ">=3.8"
dependencies = []

[project.optional-dependencies]
# dev 之外的 extras 在 M1 均不安装：M1 只用标准库（合成语料的 docx 由 zipfile 直写 OOXML，
# 以保证产物无时间戳元数据、两次生成逐字节一致）。
dev = ["pytest>=7.4"]
gui = ["PySide6>=6.4"]  # 上限交给 pip 按 PySide6 自身 requires-python 解析（6.7+ 要求 ≥3.9）；本机实测值待 M5 spike 复核
report = ["python-docx>=1.1"]
pdf = ["pypdf>=3.9"]
pkg = ["pyinstaller>=6.0"]

[project.scripts]
sdc = "sdc.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# 未做 editable 安装也能跑测试（本机 venv 引导 pip 会崩，见 plan/HANDOFF-M1 §五 环境事实）
pythonpath = ["src"]
addopts = "-q -p no:cacheprovider"
