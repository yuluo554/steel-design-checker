[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "sdc"
version = "0.1.0"
description = "钢结构连接与构件验算计算器（规范驱动、离线可复现）"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [{ name = "yuluo554" }]
keywords = ["steel", "structural-design", "gb-50017", "gb-55006", "offline", "compliance"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Natural Language :: Chinese (Simplified)",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/yuluo554/steel-design-checker"
Repository = "https://github.com/yuluo554/steel-design-checker.git"
Issues = "https://github.com/yuluo554/steel-design-checker/issues"

[project.optional-dependencies]
# dev 之外的 extras 在 M1 均不安装：M1 只用标准库（合成语料的 docx 由 zipfile 直写 OOXML，
# 以保证产物无时间戳元数据、两次生成逐字节一致）。
dev = ["pytest>=7.4", "pyyaml>=6.0,<7"]  # pyyaml 只给 CI workflow 的 YAML 守门测试用（M6）
# 上限是实测值而不是猜测：Python 3.8.8 上 pip 可解析的最高 PySide6 是 6.6.3.1
# （6.7+ 元数据 requires-python≥3.9，会被自动回避）。老解释器上的重依赖只写下限等于没 pin
# ——干净环境会解析到更新的破坏版本，所以这里同时钉住两端。
gui = ["PySide6>=6.4,<6.7"]
report = ["python-docx>=1.1"]  # 登记为可选但**不使用**：它会写真实时间与用户名，打挂 K42
pdf = ["pypdf>=3.9"]
pkg = ["pyinstaller>=6.0,<7"]  # 本机实测 6.22.3 构建通过（M5）

[project.scripts]
sdc = "sdc.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# 未做 editable 安装也能跑测试（本机 venv 引导 pip 会崩，见 plan/HANDOFF-M1 §五 环境事实）
pythonpath = ["src"]
addopts = "-q -p no:cacheprovider"
