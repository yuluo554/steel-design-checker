name: CI

# 发布门（plan/05 §七 M6 行 / 决策 D12）：3.8 是开发基线，3.12 防"dev 绿 CI 红"的版本差。
# ubuntu-24.04 的 runner 不再预装 3.8，但 setup-python 仍可从 manifest 下
# python-3.8.18-linux-24.04-x64.tar.gz，所以 3.8 矩阵钉 24.04（不走会漂移的 ubuntu-latest）。
on:
  push:
    branches: [main]
  pull_request:

defaults:
  run:
    # 显式固定 bash：Windows runner 默认 pwsh，`$?` 与 `set -e` 的语义会和 ubuntu 不一致
    shell: bash

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          # gui extras 只加在一个矩阵：其余矩阵不装 PySide6，
          # tests/_gui.py 的 importorskip 会把 GUI 两个模块声明式跳过（-rs 逐项可见）
          - { os: ubuntu-24.04, python-version: "3.8", extras: dev }
          - { os: ubuntu-latest, python-version: "3.12", extras: dev }
          - { os: windows-latest, python-version: "3.8", extras: "dev,gui" }
          - { os: windows-latest, python-version: "3.12", extras: dev }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # EOL 门在 CI 层的对应条款：`test_eol_guard.py` 只能看见**工作树**，
      # 看不见"索引里到底存了什么"。这条断言直接读 git 的判定，把
      # 「提交进仓库的 CRLF」（含被 -text 标记而绕过 .gitattributes 的文件）挡在合并前。
      - name: No CRLF committed to the index
        run: |
          offenders=$(git ls-files --eol | grep 'i/crlf' || true)
          if [ -n "$offenders" ]; then
            echo "以下文件在索引里存的是 CRLF（会打挂跨平台字节基准）："
            echo "$offenders"
            exit 1
          fi
          echo "EOL_INDEX_OK（索引内 0 个 i/crlf）"

      - name: Install with extras
        run: |
          python -m pip install -U pip
          python -m pip install -e ".[${{ matrix.extras }}]"

      # 收集数对账：GUI 模块的声明式跳过会让不同矩阵数出不同的 passed，
      # 所以把收集总数打印出来，逐项归因写进 RELEASE-M6 留档。
      # 注意：**不落地任何 scratch 文件**——Windows runner 上 `> collect.txt` 会写成 CRLF，
      # 而 tests/test_eol_guard.py 扫的是工作树（CI 首跑就是被这条抓住的）
      - name: Collect count and skip reasons
        run: |
          set +o pipefail
          python -X utf8 -m pytest --collect-only -q 2>&1 | awk -F': ' '/^tests\/test_/ {s+=$2; n++} END {printf "collected_files=%d collected_items=%d\n", n, s}'
          python -X utf8 -m sdc --version

      - name: Run the test suite
        run: python -X utf8 -m pytest -q -rs

      - name: Selfcheck (data schema and gating board)
        run: python -X utf8 -m sdc selfcheck

      - name: "Bench gate (未达标或不可用即红，两个不可判如实留档)"
        run: |
          # 退出码必须单独取（`${PIPESTATUS[0]}` 在管道执行前就展开，会拿到陈旧值——
          # run 37571427131 就是被门禁自己那条"退出码与状态对账"断言抓住的）
          # 落地文件走 .tmp_parse/：既被 .gitignore 覆盖，也在 test_eol_guard 的跳过名单里
          # 0.1.1 起带 --allow-indeterminate（DEC2=A）：分母 0 的两项按「不可判」放行，
          # 「未达标/不可用」照旧红。门禁脚本必须拿到同一个旗标，否则会对账失败。
          mkdir -p .tmp_parse
          set +e
          python -X utf8 -m sdc bench --all --json --allow-indeterminate > .tmp_parse/ci_bench.json
          bench_rc=$?
          set -e
          python -X utf8 scripts/ci_bench_gate.py .tmp_parse/ci_bench.json "$bench_rc" \
            --allow-indeterminate
          echo "bench_rc=$bench_rc（带旗标时应为 0；为 1 说明出现了真·未达标）"

      - name: Synth corpus is byte-reproducible
        run: python -X utf8 -m sdc synth --check
